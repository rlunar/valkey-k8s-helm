suite: auth secret checksum annotation
templates:
  - templates/deploy_valkey.yaml
  - templates/statefulset.yaml
  - templates/init_config.yaml
  - templates/secret.yaml
tests:
  # --- Deployment tests ---
  - it: should have auth-secret checksum annotation on deployment when auth enabled with inline password
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "test-password"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - exists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]

  - it: should have auth-secret checksum annotation on deployment when auth enabled with aclConfig
    set:
      auth.enabled: true
      auth.aclConfig: "user default on >password ~* &* +@all"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - exists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]

  - it: should not have auth-secret checksum annotation on deployment when auth disabled
    set:
      auth.enabled: false
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]

  - it: should not have auth-secret checksum when auth enabled but no inline passwords or aclConfig
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]

  # --- StatefulSet tests ---
  - it: should have auth-secret checksum annotation on statefulset when auth enabled with inline password
    set:
      replica.enabled: true
      replica.persistence.size: "1Gi"
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all +psync +replconf +ping"
          password: "test-password"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - exists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]

  - it: should have auth-secret checksum annotation on statefulset when auth enabled with aclConfig
    set:
      replica.enabled: true
      replica.persistence.size: "1Gi"
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all +psync +replconf +ping"
          password: "test-password"
      auth.aclConfig: "user guest on nopass ~public:* +@read"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - exists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]

  - it: should not have auth-secret checksum annotation on statefulset when auth disabled
    set:
      replica.enabled: true
      replica.persistence.size: "1Gi"
      auth.enabled: false
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - notExists:
          path: spec.template.metadata.annotations["checksum/auth-secret"]
